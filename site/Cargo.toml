[package]
name = "site"
description = "The topcoat-prompt docs site, built with Topcoat and the topcoat-prompt components."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The `markdown` component renders with pulldown-cmark; apps that install it add
# this dependency themselves.
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
# The real-model demo calls the Claude API over HTTPS. There is no official Rust SDK,
# so it posts to the Messages API with reqwest and parses the event stream itself.
# rustls uses ring, which the build already has, rather than reqwest's default aws-lc.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
# The component registry. `topcoat ui` only offers registries that are direct
# dependencies; the crate itself adds no code.
topcoat-prompt = { path = "../crates/topcoat-prompt" }
topcoat = { version = "0.12.1", features = ["font-fontsource", "icon-iconify", "session", "tailwind", "ui"] }

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["icon-iconify", "tailwind"] }

[dev-dependencies]
topcoat-ui = "0.12.1"
